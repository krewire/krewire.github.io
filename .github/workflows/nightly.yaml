name: Nightly Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# Krewire Contributor Portal Nightly Build Pipeline (ADR-R7P3K)
# Automated daily bundle of community portal static assets
# Triggered daily on schedule from branch 'main' or via manual dispatch
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 2 * * *'                      # Nightly build at 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run build without publishing release assets'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: nightly-krewire-github-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Prepare Nightly Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      track: nightly
      is_prerelease: "true"
    steps:
      - name: Generate Version Tag
        id: meta
        run: |
          DATE_TAG="$(date -u +%Y%m%d)"
          VER="v0.2.0-nightly.${DATE_TAG}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Generated Portal Nightly Version: ${VER}"

  build-site:
    name: Build Community Portal Artifacts (Nightly)
    needs: [classify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.23'
          check-latest: true

      - name: Verify obsolete CLI paths not present
        run: ./scripts/verify_workflows.sh

      - name: Install canonical Krew CLI
        run: |
          git clone --depth 1 --branch main "https://github.com/krewire/krewire.git" "${RUNNER_TEMP}/krewire"
          git clone --depth 1 --branch main "https://github.com/krewire/ui.git" "${RUNNER_TEMP}/ui"
          git clone --depth 1 --branch main "https://github.com/krewire/tui.git" "${RUNNER_TEMP}/tui"
          git clone --depth 1 --branch main "https://github.com/krewire/krew.git" "${RUNNER_TEMP}/krew"
          cd "${RUNNER_TEMP}"
          go work init ./krewire ./ui ./tui ./krew
          cd "${RUNNER_TEMP}/krew"
          mkdir -p "${RUNNER_TEMP}/bin"
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "${RUNNER_TEMP}/bin/krew" ./cmd/krew
          ln -s "${RUNNER_TEMP}/bin/krew" "${RUNNER_TEMP}/bin/kiw"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Verify CLI installation
        run: |
          krew version
          kiw version

      - name: Build Static Site
        run: |
          krew build
          test -d .krewire/build || { echo "Build output missing"; exit 1; }

      - name: Package Bundle
        run: |
          VERSION="${{ needs.classify.outputs.version }}"
          mkdir -p dist
          BUNDLE="krewire-github-io-${VERSION}.tar.gz"
          tar -C .krewire/build -czf "dist/${BUNDLE}" .
          cd dist
          sha256sum "${BUNDLE}" > "${BUNDLE}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: portal-dist
          path: dist/*
          retention-days: 5

  publish:
    name: Publish Nightly Release Assets
    needs: [classify, build-site]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: inputs.dry_run != true
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Built Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: portal-dist
          path: release-assets

      - name: Consolidate Checksums
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt || true
          ls -la

      - name: Create or Update Nightly Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ needs.classify.outputs.version }}
          name: Krewire Community Portal ${{ needs.classify.outputs.version }} (nightly)
          prerelease: true
          draft: false
          files: |
            release-assets/*
          body: |
            ### Krewire Community Portal Nightly Release
            
            - **Version**: `${{ needs.classify.outputs.version }}`
            - **Track**: `nightly`
            - **Commit**: `${{ github.sha }}`
            - **Build Date**: `$(date -u +"%Y-%m-%d %H:%M:%S UTC")`
            - **Distribution**: Static GitHub Pages Assets (`kiw build`)
            
            #### Checksums (SHA-256)
            ```
            $(cat release-assets/SHA256SUMS.txt)
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
