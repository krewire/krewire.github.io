name: Deploy Contributor Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      - name: Setup Node (Tailwind plugin)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install kiw CLI
        run: go install github.com/krewire/kiw/cmd/kiw@v0.1.4

      - name: Build website
        run: |
          kiw build
          mkdir -p .krewire/build/assets
          npm run build:css
          cp assets/app.js .krewire/build/assets/
          for f in .krewire/build/*.html; do
            if ! grep -q 'assets/app.js' "$f"; then
              sed -i 's|</body>|<script src="/assets/app.js" defer></script></body>|' "$f"
            fi
          done
          touch .krewire/build/.nojekyll

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: .krewire/build
          retention-days: 1

  deploy-gh-pages:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: .krewire/build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .krewire/build
          publish_branch: gh-pages
          commit_message: "deploy: site from ${{ github.sha }}"

  deploy-vps:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: site

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to contributors.krewire.com
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            site/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/contributors.krewire.com/
