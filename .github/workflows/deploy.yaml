name: Deploy Contributor Portal (Production)

# ─────────────────────────────────────────────────────────────────────────────
# Trigger on stable version git tags only (e.g. v0.1.0, v1.0.0, v2.1.3).
# Pre-releases, development branches, and raw commits must pass through
# the release process before reaching production.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual production deployment'
        required: false
        default: 'Manual maintenance trigger'

permissions:
  contents: write

concurrency:
  group: deploy-contributor-portal
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build the contributor portal site
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build portal (Production Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Release Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "▶ Validating stable release tag: ${TAG}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "✗ Error: '${TAG}' is not a valid stable SemVer tag."
            exit 1
          fi
          echo "✓ Stable version tag validated: ${TAG}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Install kiw CLI
        run: |
          git clone --depth 1 --branch main "https://github.com/krewire/krewire.git" "${RUNNER_TEMP}/krewire"
          git clone --depth 1 --branch main "https://github.com/krewire/mdbind.git" "${RUNNER_TEMP}/mdbind"
          cd "${RUNNER_TEMP}/krewire"
          go build -o "${RUNNER_TEMP}/bin/kiw" ./tools/kiw/cmd/kiw
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Verify kiw installation
        run: kiw version

      - name: Build website
        run: |
          kiw build
          touch .krewire/build/.nojekyll
          # Mirror output into contribute/ subfolder so both root (https://krewire.github.io/)
          # and mounted base path (https://krewire.github.io/contribute/ and krewire.com/contribute/) resolve identically.
          mkdir -p .krewire/build/contribute
          cp -a .krewire/build/assets .krewire/build/contribute/
          cp -a .krewire/build/index.html .krewire/build/contribute/
          cp -a .krewire/build/404.html .krewire/build/contribute/ 2>/dev/null || true
          cp -a .krewire/build/*.png .krewire/build/*.svg .krewire/build/*.ico .krewire/build/*.xml .krewire/build/*.webmanifest .krewire/build/contribute/ 2>/dev/null || true

      - name: Verify build outputs
        run: |
          test -f .krewire/build/index.html || { echo "✗ Missing root index.html"; exit 1; }
          test -f .krewire/build/contribute/index.html || { echo "✗ Missing contribute/index.html"; exit 1; }
          test -d .krewire/build/assets || { echo "✗ Missing assets"; exit 1; }
          test -d .krewire/build/contribute/assets || { echo "✗ Missing contribute/assets"; exit 1; }
          test ! -f .krewire/build/CNAME || { echo "✗ CNAME must not exist"; exit 1; }
          echo "✓ Build outputs verified for dual-mount."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build-${{ github.sha }}
          path: .krewire/build
          retention-days: 3
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to GitHub Pages
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-gh-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build-${{ github.sha }}
          path: .krewire/build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .krewire/build
          publish_branch: gh-pages
          commit_message: "release(portal): production release ${{ github.ref_name }} (${{ github.sha }})"
