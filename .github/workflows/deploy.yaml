name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      - name: Setup Node (Tailwind plugin)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install kiw CLI
        run: go install github.com/krewire/kiw/cmd/kiw@v0.1.4

      - name: Build website
        run: |
          kiw build
          mkdir -p .krewire/build/assets
          cp -r assets/* .krewire/build/assets/ || true
          sed -i 's|</body>|<script src="/assets/app.js" defer></script></body>|g' .krewire/build/index.html
          sed -i 's|</body>|<script src="/assets/app.js" defer></script></body>|g' .krewire/build/404.html 2>/dev/null || true
          touch .krewire/build/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .krewire/build
          publish_branch: gh-pages
          commit_message: "deploy: site from ${{ github.sha }}"
