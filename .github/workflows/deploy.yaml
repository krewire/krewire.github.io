name: Deploy Contributor Portal (Production)

# ─────────────────────────────────────────────────────────────────────────────
# Trigger on stable version git tags only (e.g. v0.1.0, v1.0.0, v2.1.3).
# Pre-releases, development branches, and raw commits must pass through
# the release process before reaching production.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-lts*'
  workflow_run:
    workflows: ["Release Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual production deployment'
        required: true
        default: 'Authorized production maintenance'

permissions: {}

concurrency:
  group: deploy-contributor-portal
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 0 — Security Release & Deployment Gate
  # ─────────────────────────────────────────────────────────────────────────────
  gate:
    name: Production Release Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy_sha: ${{ steps.validate.outputs.deploy_sha }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
      deploy_track: ${{ steps.validate.outputs.deploy_track }}
      source_type: ${{ steps.validate.outputs.source_type }}
      run_id: ${{ steps.validate.outputs.run_id }}
    steps:
      - name: Validate Release Source & Policy
        id: validate
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"
          echo "=== Evaluating Production Gate for Event: ${EVENT_NAME} ==="

          DEPLOY_SHA=""
          RELEASE_TAG=""
          DEPLOY_TRACK=""
          SOURCE_TYPE=""
          ORIGIN_RUN_ID=""

          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            HEAD_REPO="${{ github.event.workflow_run.head_repository.full_name }}"
            ORIGIN_RUN_ID="${{ github.event.workflow_run.id }}"
            
            echo "Originating Workflow Conclusion: ${CONCLUSION}"
            echo "Originating Repo: ${HEAD_REPO}"
            echo "Originating Head Branch / Ref: ${HEAD_BRANCH}"
            echo "Originating Head SHA: ${HEAD_SHA}"
            echo "Originating Run ID: ${ORIGIN_RUN_ID}"

            if [ "${CONCLUSION}" != "success" ]; then
              echo "::error::Release Pipeline did not succeed (conclusion='${CONCLUSION}'). Deployment BLOCKED."
              exit 1
            fi

            if [ "${HEAD_REPO}" != "${{ github.repository }}" ]; then
              echo "::error::Unauthorized repository: '${HEAD_REPO}' != '${{ github.repository }}'. Deployment BLOCKED."
              exit 1
            fi

            if [ -z "${HEAD_SHA}" ]; then
              echo "::error::Originating workflow head_sha is empty. Deployment BLOCKED."
              exit 1
            fi

            # Check if originating run corresponds to a valid SemVer stable or LTS tag
            if [[ "${HEAD_BRANCH}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-lts.*)?$ ]]; then
              RELEASE_TAG="${HEAD_BRANCH}"
              DEPLOY_TRACK="stable"
              if [[ "${HEAD_BRANCH}" =~ -lts ]]; then
                DEPLOY_TRACK="lts"
              fi
            else
              # Non-stable / prerelease tracks (rc, beta, alpha, exp, dev, nightly, main) are strictly rejected
              echo "::error::Originating branch/tag '${HEAD_BRANCH}' is not a permitted stable or LTS release. Production requires stable/LTS tags."
              exit 1
            fi

            DEPLOY_SHA="${HEAD_SHA}"
            SOURCE_TYPE="workflow_run"

          elif [ "${EVENT_NAME}" = "push" ]; then
            REF="${{ github.ref }}"
            if [[ ! "${REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-lts.*)?$ ]]; then
              echo "::error::Pushed ref '${REF}' is not a valid stable or LTS tag. Deployment BLOCKED."
              exit 1
            fi

            TAG="${REF#refs/tags/}"
            # Block any pre-release substrings even if prefix matches
            if [[ "${TAG}" =~ -(rc|beta|alpha|exp|dev|nightly) ]]; then
              echo "::error::Tag '${TAG}' is a pre-release or experimental track. Deployment BLOCKED."
              exit 1
            fi

            RELEASE_TAG="${TAG}"
            DEPLOY_SHA="${{ github.sha }}"
            DEPLOY_TRACK="stable"
            if [[ "${TAG}" =~ -lts ]]; then
              DEPLOY_TRACK="lts"
            fi
            SOURCE_TYPE="tag_push"

          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            REASON="${{ inputs.reason }}"
            if [ -z "${REASON}" ] || [ "${REASON}" = "null" ]; then
              echo "::error::Manual production deployment requires an auditable reason. Deployment BLOCKED."
              exit 1
            fi
            echo "Manual deployment authorized by: ${{ github.actor }}, reason: ${REASON}"
            
            DEPLOY_SHA="${{ github.sha }}"
            SOURCE_TYPE="workflow_dispatch"
            DEPLOY_TRACK="manual"
            RELEASE_TAG="${{ github.ref_name }}"
          else
            echo "::error::Unsupported trigger event: ${EVENT_NAME}. Deployment BLOCKED."
            exit 1
          fi

          echo "deploy_sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "deploy_track=${DEPLOY_TRACK}" >> "$GITHUB_OUTPUT"
          echo "source_type=${SOURCE_TYPE}" >> "$GITHUB_OUTPUT"
          echo "run_id=${ORIGIN_RUN_ID}" >> "$GITHUB_OUTPUT"

          echo "✓ Gate validation passed. Target SHA: ${DEPLOY_SHA}, Tag: ${RELEASE_TAG}, Track: ${DEPLOY_TRACK}"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build the contributor portal site
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build portal (Production Gate)
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: Verify obsolete CLI paths not present
        run: ./scripts/verify_workflows.sh

      - name: Install canonical Krew CLI
        run: |
          git clone --depth 1 --branch main "https://github.com/krewire/krewire.git" "${RUNNER_TEMP}/krewire"
          git clone --depth 1 --branch main "https://github.com/krewire/hub.git" "${RUNNER_TEMP}/hub"
          git clone --depth 1 --branch main "https://github.com/krewire/ui.git" "${RUNNER_TEMP}/ui"
          git clone --depth 1 --branch main "https://github.com/krewire/tui.git" "${RUNNER_TEMP}/tui"
          git clone --depth 1 --branch main "https://github.com/krewire/krew.git" "${RUNNER_TEMP}/krew"
          export GOWORK="${RUNNER_TEMP}/krew/go.work"
          cd "${RUNNER_TEMP}/krew"
          mkdir -p "${RUNNER_TEMP}/bin"
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "${RUNNER_TEMP}/bin/krew" ./cli
          ln -sf "${RUNNER_TEMP}/bin/krew" "${RUNNER_TEMP}/bin/kiw"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Verify CLI installation
        run: |
          krew version
          kiw version

      - name: Build website
        run: |
          krew build
          touch .krewire/build/.nojekyll
          # Mirror output into contribute/ subfolder so both root (https://krewire.github.io/)
          # and mounted base path (https://krewire.github.io/contribute/ and krewire.com/contribute/) resolve identically.
          mkdir -p .krewire/build/contribute
          cp -a .krewire/build/assets .krewire/build/contribute/
          cp -a .krewire/build/index.html .krewire/build/contribute/
          cp -a .krewire/build/404.html .krewire/build/contribute/ 2>/dev/null || true
          cp -a .krewire/build/*.png .krewire/build/*.svg .krewire/build/*.ico .krewire/build/*.xml .krewire/build/*.webmanifest .krewire/build/contribute/ 2>/dev/null || true

      - name: Verify build outputs and generate provenance manifest
        run: |
          test -f .krewire/build/index.html || { echo "✗ Missing root index.html"; exit 1; }
          test -f .krewire/build/contribute/index.html || { echo "✗ Missing contribute/index.html"; exit 1; }
          test -d .krewire/build/assets || { echo "✗ Missing assets"; exit 1; }
          test -f .krewire/build/assets/krewire.css || { echo "✗ Missing assets/krewire.css"; exit 1; }
          test -f .krewire/build/assets/krewire.js || { echo "✗ Missing assets/krewire.js"; exit 1; }
          test -d .krewire/build/contribute/assets || { echo "✗ Missing contribute/assets"; exit 1; }
          test -f .krewire/build/contribute/assets/krewire.css || { echo "✗ Missing contribute/assets/krewire.css"; exit 1; }
          test -f .krewire/build/contribute/assets/krewire.js || { echo "✗ Missing contribute/assets/krewire.js"; exit 1; }
          test ! -f .krewire/build/CNAME || { echo "✗ CNAME must not exist"; exit 1; }

          # Generate provenance checksums manifest for deployment
          cd .krewire/build
          echo "# Krewire Contributor Portal Build Manifest" > BUILD_MANIFEST.sha256
          echo "# Commit: ${{ needs.gate.outputs.deploy_sha }}" >> BUILD_MANIFEST.sha256
          echo "# Tag: ${{ needs.gate.outputs.release_tag }}" >> BUILD_MANIFEST.sha256
          echo "# Track: ${{ needs.gate.outputs.deploy_track }}" >> BUILD_MANIFEST.sha256
          echo "# Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> BUILD_MANIFEST.sha256
          find . -type f ! -name "BUILD_MANIFEST.sha256" -exec sha256sum {} + | sort -k 2 >> BUILD_MANIFEST.sha256
          echo "✓ Build outputs and provenance manifest generated."

      - name: Upload build artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: site-build-${{ needs.gate.outputs.deploy_sha }}
          path: .krewire/build
          retention-days: 3
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to GitHub Pages
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-gh-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [gate, build]
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: site-build-${{ needs.gate.outputs.deploy_sha }}
          path: .krewire/build

      - name: Verify Artifact Provenance & Checksums
        run: |
          test -f .krewire/build/BUILD_MANIFEST.sha256 || { echo "✗ Missing build manifest"; exit 1; }
          cd .krewire/build
          grep -v "^#" BUILD_MANIFEST.sha256 | sha256sum -c - || { echo "✗ Artifact checksum verification failed"; exit 1; }
          echo "✓ Deploy artifact matches exact release build provenance."

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .krewire/build
          publish_branch: gh-pages
          commit_message: "release(portal): production release ${{ needs.gate.outputs.release_tag }} (${{ needs.gate.outputs.deploy_sha }})"
