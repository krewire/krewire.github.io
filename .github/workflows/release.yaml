name: Release Pipeline (Multi-Track)

# ─────────────────────────────────────────────────────────────────────────────
# Krewire Contributor Portal Multi-Track Release Pipeline (ADR-R7P3K)
# Tracks: lts, stable, pre-release (rc, beta, alpha), nightly, experimental, dev
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'             # stable (GA)
      - 'v[0-9]+.[0-9]+.[0-9]+-lts*'        # lts
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.*'        # rc
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.*'      # beta
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.*'     # alpha
      - 'v[0-9]+.[0-9]+.[0-9]+-nightly.*'   # nightly tag
      - 'v[0-9]+.[0-9]+.[0-9]+-exp.*'       # experimental tag
      - 'v[0-9]+.[0-9]+.[0-9]+-dev.*'       # dev tag
  schedule:
    - cron: '0 2 * * *'                      # Nightly build at 02:00 UTC
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track to build and publish'
        required: true
        type: choice
        default: 'stable'
        options:
          - 'lts'
          - 'stable'
          - 'rc'
          - 'beta'
          - 'alpha'
          - 'nightly'
          - 'experimental'
          - 'dev'

permissions:
  contents: write

concurrency:
  group: release-krewire-github-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify Release Track
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.meta.outputs.track }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Parse Trigger & Track
        id: meta
        run: |
          REF="${GITHUB_REF:-}"
          EVENT="${GITHUB_EVENT_NAME}"
          TRACK="${{ inputs.track }}"
          
          if [ "${EVENT}" = "schedule" ]; then
            TRACK="nightly"
            DATE_TAG="$(date -u +%Y%m%d)"
            VER="v0.2.0-nightly.${DATE_TAG}"
            PRERELEASE="true"
          elif [[ "${REF}" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
            VER="${TAG}"
            if [[ "${TAG}" =~ -lts ]]; then
              TRACK="lts"
              PRERELEASE="false"
            elif [[ "${TAG}" =~ -rc ]]; then
              TRACK="rc"
              PRERELEASE="true"
            elif [[ "${TAG}" =~ -beta ]]; then
              TRACK="beta"
              PRERELEASE="true"
            elif [[ "${TAG}" =~ -alpha ]]; then
              TRACK="alpha"
              PRERELEASE="true"
            elif [[ "${TAG}" =~ -nightly ]]; then
              TRACK="nightly"
              PRERELEASE="true"
            elif [[ "${TAG}" =~ -exp ]]; then
              TRACK="experimental"
              PRERELEASE="true"
            elif [[ "${TAG}" =~ -dev ]]; then
              TRACK="dev"
              PRERELEASE="true"
            else
              TRACK="stable"
              PRERELEASE="false"
            fi
          else
            if [ -z "${TRACK}" ]; then TRACK="dev"; fi
            DATE_TAG="$(date -u +%Y%m%d)"
            VER="v0.2.0-${TRACK}.${DATE_TAG}.${GITHUB_SHA::7}"
            if [ "${TRACK}" = "stable" ] || [ "${TRACK}" = "lts" ]; then
              PRERELEASE="false"
            else
              PRERELEASE="true"
            fi
          fi

          echo "track=${TRACK}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Identified Track: ${TRACK}, Version: ${VER}, PreRelease: ${PRERELEASE}"

  build-site:
    name: Build Community Portal Artifacts
    needs: [classify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Install kiw CLI
        run: |
          git clone --depth 1 --branch main "https://github.com/krewire/krewire.git" "${RUNNER_TEMP}/krewire"
          git clone --depth 1 --branch main "https://github.com/krewire/krew.git" "${RUNNER_TEMP}/krew"
          cd "${RUNNER_TEMP}/krewire"
          go build -o "${RUNNER_TEMP}/bin/kiw" ./tools/kiw/cmd/kiw
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Build Static Site
        run: |
          kiw build
          test -d .krewire/build || { echo "Build output missing"; exit 1; }

      - name: Package Bundle
        run: |
          VERSION="${{ needs.classify.outputs.version }}"
          mkdir -p dist
          BUNDLE="krewire-github-io-${VERSION}.tar.gz"
          tar -C .krewire/build -czf "dist/${BUNDLE}" .
          cd dist
          sha256sum "${BUNDLE}" > "${BUNDLE}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: dist/*
          retention-days: 5

  publish:
    name: Publish Release Assets
    needs: [classify, build-site]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: portal-dist
          path: release-assets

      - name: Consolidate Checksums
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt || true
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        with:
          tag_name: ${{ needs.classify.outputs.version }}
          name: Krewire Community Portal ${{ needs.classify.outputs.version }} (${{ needs.classify.outputs.track }})
          prerelease: ${{ needs.classify.outputs.is_prerelease == 'true' }}
          draft: false
          files: |
            release-assets/*
          body: |
            ### Krewire Community Portal Release — Track: `${{ needs.classify.outputs.track }}`
            
            - **Version**: `${{ needs.classify.outputs.version }}`
            - **Track**: `${{ needs.classify.outputs.track }}`
            - **Commit**: `${{ github.sha }}`
            - **Distribution**: Static GitHub Pages Assets (`kiw build`)
            
            #### Checksums (SHA-256)
            ```
            $(cat release-assets/SHA256SUMS.txt)
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
