name: Emergency Hotfix Deploy to Contributor Portal (Protocol Bypass)

# ─────────────────────────────────────────────────────────────────────────────
# EMERGENCY HOTFIX DEPLOYMENT WORKFLOW
#
# Bypasses standard production deployment protocols (stable git tag requirement,
# release gating, and multi-stage approval).
#
# Triggered immediately upon any push/commit to 'hotfix' or 'hotfix/**' branches.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - 'hotfix'
      - 'hotfix/**'
      - 'hotfix-*'
  workflow_dispatch:
    inputs:
      hotfix_description:
        description: 'Brief description of emergency hotfix reason'
        required: false
        default: 'Emergency patch via workflow_dispatch'

permissions:
  contents: write

concurrency:
  group: deploy-contributor-portal
  cancel-in-progress: false # Do not abort in-flight hotfix deployments

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Fast Build Portal Site Artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  build-hotfix:
    name: Build Hotfix (Fast Track)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hotfix Branch
        uses: actions/checkout@v4

      - name: Log Hotfix Trigger & Audit Trail
        run: |
          echo "=========================================================="
          echo "🚨 EMERGENCY HOTFIX PIPELINE TRIGGERED (PORTAL)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          echo "Note:   Standard Git Tag release protocol BYPASSED."
          echo "=========================================================="

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Setup Node (Tailwind plugin)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install kiw CLI
        run: |
          git clone --depth 1 --branch main "https://github.com/krewire/krewire.git" "${RUNNER_TEMP}/krewire"
          git clone --depth 1 --branch main "https://github.com/krewire/mdbind.git" "${RUNNER_TEMP}/mdbind"
          cd "${RUNNER_TEMP}/krewire"
          go build -o "${RUNNER_TEMP}/bin/kiw" ./tools/kiw/cmd/kiw
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Build website (Hotfix)
        run: |
          kiw build
          touch .krewire/build/.nojekyll
          # Mirror output into contribute/ subfolder so both root (https://krewire.github.io/)
          # and mounted base path (https://krewire.github.io/contribute/ and krewire.com/contribute/) resolve identically.
          mkdir -p .krewire/build/contribute
          cp -a .krewire/build/assets .krewire/build/contribute/
          cp -a .krewire/build/index.html .krewire/build/contribute/
          cp -a .krewire/build/404.html .krewire/build/contribute/ 2>/dev/null || true
          cp -a .krewire/build/*.png .krewire/build/*.svg .krewire/build/*.ico .krewire/build/*.xml .krewire/build/*.webmanifest .krewire/build/contribute/ 2>/dev/null || true

      - name: Fast sanity check of build outputs
        run: |
          test -f .krewire/build/index.html || { echo "✗ Missing root index.html"; exit 1; }
          test -f .krewire/build/contribute/index.html || { echo "✗ Missing contribute/index.html"; exit 1; }
          test -d .krewire/build/assets || { echo "✗ Missing assets"; exit 1; }
          test -d .krewire/build/contribute/assets || { echo "✗ Missing contribute/assets"; exit 1; }
          test ! -f .krewire/build/CNAME || { echo "✗ CNAME must not exist"; exit 1; }
          echo "✓ Fast sanity checks passed."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-build-${{ github.sha }}
          path: .krewire/build
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Fast Deploy to GitHub Pages
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-hotfix-gh-pages:
    name: Deploy Hotfix to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-hotfix
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hotfix-build-${{ github.sha }}
          path: .krewire/build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .krewire/build
          publish_branch: gh-pages
          commit_message: "hotfix(emergency): fast deploy from ${{ github.sha }} [bypass release protocol]"
