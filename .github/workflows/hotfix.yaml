name: Hotfix Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# EMERGENCY HOTFIX DEPLOYMENT WORKFLOW
#
# Bypasses standard production deployment protocols (stable git tag requirement,
# release gating, and multi-stage approval).
#
# Triggered immediately upon any push/commit to 'hotfix' or 'hotfix/**' branches.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - 'hotfix'
      - 'hotfix/**'
      - 'hotfix-*'
  workflow_dispatch:
    inputs:
      hotfix_description:
        description: 'Brief description of emergency hotfix reason'
        required: true
        default: 'Emergency patch via workflow_dispatch'

permissions: {}

concurrency:
  group: deploy-contributor-portal
  cancel-in-progress: false # Do not abort in-flight hotfix deployments

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Fast Build Portal Site Artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  build-hotfix:
    name: Build Hotfix (Fast Track)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Hotfix Branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log Hotfix Trigger & Audit Trail
        run: |
          echo "=========================================================="
          echo "🚨 EMERGENCY HOTFIX PIPELINE TRIGGERED (PORTAL)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          echo "Note:   Standard Git Tag release protocol BYPASSED."
          echo "=========================================================="

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.23"
          check-latest: true
          cache: true

      - name: Verify obsolete CLI paths not present
        run: ./scripts/verify_workflows.sh

      - name: Install canonical Krew CLI
        run: |
          git clone --depth 1 --branch main "https://github.com/krewire/krewire.git" "${RUNNER_TEMP}/krewire"
          git clone --depth 1 --branch main "https://github.com/krewire/ui.git" "${RUNNER_TEMP}/ui"
          git clone --depth 1 --branch main "https://github.com/krewire/tui.git" "${RUNNER_TEMP}/tui"
          git clone --depth 1 --branch main "https://github.com/krewire/krew.git" "${RUNNER_TEMP}/krew"
          cd "${RUNNER_TEMP}"
          go work init ./krewire ./ui ./tui ./krew
          cd "${RUNNER_TEMP}/krew"
          mkdir -p "${RUNNER_TEMP}/bin"
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "${RUNNER_TEMP}/bin/krew" ./cmd/krew
          ln -s "${RUNNER_TEMP}/bin/krew" "${RUNNER_TEMP}/bin/kiw"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Verify CLI installation
        run: |
          krew version
          kiw version

      - name: Build website (Hotfix)
        run: |
          krew build
          touch .krewire/build/.nojekyll
          # Mirror output into contribute/ subfolder so both root (https://krewire.github.io/)
          # and mounted base path (https://krewire.github.io/contribute/ and krewire.com/contribute/) resolve identically.
          mkdir -p .krewire/build/contribute
          cp -a .krewire/build/assets .krewire/build/contribute/
          cp -a .krewire/build/index.html .krewire/build/contribute/
          cp -a .krewire/build/404.html .krewire/build/contribute/ 2>/dev/null || true
          cp -a .krewire/build/*.png .krewire/build/*.svg .krewire/build/*.ico .krewire/build/*.xml .krewire/build/*.webmanifest .krewire/build/contribute/ 2>/dev/null || true

      - name: Fast sanity check of build outputs and provenance manifest
        run: |
          test -f .krewire/build/index.html || { echo "✗ Missing root index.html"; exit 1; }
          test -f .krewire/build/contribute/index.html || { echo "✗ Missing contribute/index.html"; exit 1; }
          test -d .krewire/build/assets || { echo "✗ Missing assets"; exit 1; }
          test -f .krewire/build/assets/krewire.css || { echo "✗ Missing assets/krewire.css"; exit 1; }
          test -f .krewire/build/assets/krewire.js || { echo "✗ Missing assets/krewire.js"; exit 1; }
          test -d .krewire/build/contribute/assets || { echo "✗ Missing contribute/assets"; exit 1; }
          test -f .krewire/build/contribute/assets/krewire.css || { echo "✗ Missing contribute/assets/krewire.css"; exit 1; }
          test -f .krewire/build/contribute/assets/krewire.js || { echo "✗ Missing contribute/assets/krewire.js"; exit 1; }
          test ! -f .krewire/build/CNAME || { echo "✗ CNAME must not exist"; exit 1; }

          # Generate hotfix build manifest
          cd .krewire/build
          echo "# Hotfix Build Manifest" > BUILD_MANIFEST.sha256
          echo "# Commit: ${{ github.sha }}" >> BUILD_MANIFEST.sha256
          echo "# Branch: ${{ github.ref_name }}" >> BUILD_MANIFEST.sha256
          echo "# Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> BUILD_MANIFEST.sha256
          find . -type f ! -name "BUILD_MANIFEST.sha256" -exec sha256sum {} + | sort -k 2 >> BUILD_MANIFEST.sha256
          echo "✓ Hotfix build outputs and manifest verified."

      - name: Upload hotfix build artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: hotfix-site-build-${{ github.sha }}
          path: .krewire/build
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy Hotfix to GitHub Pages
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-hotfix:
    name: Deploy Hotfix to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-hotfix
    permissions:
      contents: write
    steps:
      - name: Download hotfix build artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: hotfix-site-build-${{ github.sha }}
          path: .krewire/build

      - name: Verify Hotfix Artifact Provenance
        run: |
          test -f .krewire/build/BUILD_MANIFEST.sha256 || { echo "✗ Missing hotfix manifest"; exit 1; }
          cd .krewire/build
          grep -v "^#" BUILD_MANIFEST.sha256 | sha256sum -c - || { echo "✗ Hotfix checksum verification failed"; exit 1; }
          echo "✓ Hotfix artifact provenance and checksums verified."

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .krewire/build
          publish_branch: gh-pages
          commit_message: "hotfix(portal): emergency deploy ${{ github.sha }} - ${{ github.event.inputs.hotfix_description }}"
