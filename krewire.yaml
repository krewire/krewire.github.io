project:
  name: "krewire.github.io"
  kind: site
  version: "v0.1.0"
  author: "Krewire Contributors"

build:
  output: ".krewire/build"
  base: "/contribute/"

title: "Krewire Community — Contribution & Sponsorship Portal"
description: "The official contributor hub and sponsorship platform for the Krewire open-source ecosystem."
nav:
  - text: "Why Contribute"
    url: "#privileges"
  - text: "Pathways & Repos"
    url: "#pathways"
  - text: "Contributor Guide"
    url: "#guide"
  - text: "Quality Gates"
    url: "#standards"
  - text: "Sponsorship"
    url: "#sponsorship"
  - text: "AI Boost"
    url: "#boost"
  - text: "GitHub Org"
    url: "https://github.com/krewire"
footer: "© 2026 Krewire Contributors — An open-source collective based in Indonesia. Built 100% with Krewire site workload."
theme:
  default: "auto"
  light:
    primary: "#39D353"
    primary-content: "#0B1F3B"
    secondary: "#00D1C1"
    secondary-content: "#0B1F3B"
    accent: "#FF3B2E"
    accent-content: "#ffffff"
    base-1: "#FAF8F4"
    base-1-content: "#0B1F3B"
    base-2: "#f2ede4"
    base-2-content: "#57677d"
  dark:
    primary: "#39D353"
    primary-content: "#0B1F3B"
    secondary: "#00D1C1"
    secondary-content: "#0B1F3B"
    accent: "#FF3B2E"
    accent-content: "#ffffff"
    base-1: "#0B1F3B"
    base-1-content: "#FAF8F4"
    base-2: "#112646"
    base-2-content: "#9ab0ce"

i18n:
  default_locale: "en"
  fallback_locale: "en"
  base_path: "lang"
  locales:
    - "en"
    - "id"

auto_assets:
  bundle: true

