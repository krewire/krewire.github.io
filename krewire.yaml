project:
  name: "krewire.github.io"
  kind: site
  version: "v0.1.0"
  author: "Krewire Contributors"

build:
  output: ".krewire/build"
  base: "/"

title: "Krewire Release — Official Release Launch & Community Hub"
description: "The official release hub, contributor portal, and sponsorship platform for the Krewire open-source ecosystem."
nav:
  - text: "v0.1.0 Highlights"
    url: "#releases"
  - text: "What's New"
    url: "#features"
  - text: "8 Workloads"
    url: "#workloads"
  - text: "Quickstart"
    url: "#quickstart"
  - text: "Repositories"
    url: "#repositories"
  - text: "Roadmap"
    url: "#roadmap"
  - text: "AI Boost"
    url: "#boost"
  - text: "GitHub Releases"
    url: "https://github.com/krewire/krewire/releases"
footer: "© 2026 Krewire Contributors — Built 100% with Krewire site workload."
theme:
  default: "auto"
  light:
    primary: "#39D353"
    primary-content: "#0B1F3B"
    secondary: "#00D1C1"
    secondary-content: "#0B1F3B"
    accent: "#FF3B2E"
    accent-content: "#ffffff"
    base-1: "#FAF8F4"
    base-1-content: "#0B1F3B"
    base-2: "#f2ede4"
    base-2-content: "#57677d"
  dark:
    primary: "#39D353"
    primary-content: "#0B1F3B"
    secondary: "#00D1C1"
    secondary-content: "#0B1F3B"
    accent: "#FF3B2E"
    accent-content: "#ffffff"
    base-1: "#0B1F3B"
    base-1-content: "#FAF8F4"
    base-2: "#112646"
    base-2-content: "#9ab0ce"

i18n:
  default_locale: "en"
  fallback_locale: "en"
  base_path: "lang"
  locales:
    - "en"
    - "id"
