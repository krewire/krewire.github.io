<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Redirecting...</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // If it's already an .html file, don't redirect
      if (path.endsWith('.html')) return;

      // If it's a directory request (ends with /), try index.html
      if (path.endsWith('/')) {
        window.location.href = path + 'index.html' + search + hash;
        return;
      }

      // Try appending .html for extensionless routes
      window.location.href = path + '.html' + search + hash;
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
