services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: krewire-oss:latest
    container_name: krewire-oss
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
